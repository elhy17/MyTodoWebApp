spring.application.name=todoApp

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}
server.ssl.enabled=${TLS_ENABLED:false}
server.ssl.key-store=${TLS_KEYSTORE:}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${TLS_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${TLS_KEY_ALIAS:}
